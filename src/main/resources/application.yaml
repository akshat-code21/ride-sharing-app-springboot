jwt:
  secret: mysupersecretkey123456789mytokenkey
  expiration: 86400000  # 24 hours in ms

spring:
  datasource:
    url: jdbc:h2:mem:vehicledb
    driverClassName: org.h2.Driver
    username: sa
    password: password
    data:
      mongodb:
        uri: mongodb://localhost:27017/
    application:
      name: uber

  jpa:
    hibernate:
      ddl-auto: update # creates schema automatically
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8081
